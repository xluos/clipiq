name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            daemon-target: --mac
          - os: windows-latest
            target: --win
            daemon-target: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone ai-model-daemon
        run: git clone https://github.com/xluos/ai-model-daemon.git ../ai-model-daemon

      - name: Install dependencies
        timeout-minutes: 10
        env:
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: npm ci --no-audit --no-fund --loglevel=http

      - name: Build renderer
        run: npm run build

      - name: Build daemon
        run: node scripts/build-daemon.cjs ${{ matrix.daemon-target }}

      - name: Build & publish (${{ matrix.os }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder ${{ matrix.target }} --publish always

  extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Pack extension
        run: npm run dist:extension

      - name: Upload artifact (CI sanity check)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: clipiq-bridge-v${{ steps.version.outputs.version }}
          path: release/clipiq-bridge-v*.zip
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/clipiq-bridge-v*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
