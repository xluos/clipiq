<!-- macOS 顶部状态栏模板图标:纯黑 + 透明,内容贴满 viewBox 22x22,无外 padding。
     设计语言:堆叠的视频帧 + 中间挖空 play 三角,与 app dock 图标语义一致但单色化。
     系统会按 menubar 主题自动反色,所以用纯黑 + 镂空(evenodd)实现"挖空"。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <rect x="4.8" y="0.6" width="12.4" height="2.4" rx="1.2" fill="#000"/>
  <rect x="3.3" y="2.6" width="15.4" height="2.4" rx="1.2" fill="#000"/>
  <path fill-rule="evenodd" d="M3 5.4 h16 a3 3 0 0 1 3 3 v10.6 a3 3 0 0 1-3 3 h-16 a3 3 0 0 1-3-3 v-10.6 a3 3 0 0 1 3-3 z M9.2 10 v6.8 l5.9-3.4 z" fill="#000"/>
</svg>
